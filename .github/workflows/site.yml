name: site

# Pages build + deploy only. Data sync is owned by the tierstats-publish Worker
# (5-minute Cloudflare cron + the sheet's Apps Script trigger) — this workflow
# must NOT regenerate data.js, or two writers fight over the file forever
# (Python writes 1550.0, JS writes 1550 → endless "changed" commits).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
